<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F6B3F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mon Poulailler">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mon Poulailler</title>
<style>
:root{--red:#C62828;--redDk:#8E1B1B;--redBg:#FDECEC;--redB:#F3DADA;--redIn:#E4BFBF;
--green:#2F6B3F;--greenDk:#1F4A2B;--greenBg:#E6F0E8;--greenB:#DCE8DF;--greenIn:#BFD3C5;
--ink:#1F1F1F;--mut:#5F5F5F;--amberBg:#FFF0D6;--amber:#7A4300;
--yel:#F2B01E;--yelDk:#8A5A00;--yelBg:#FFF6DC;--yelB:#F3E3B0;--cream:#FBF8EE}
.t-green{--p:var(--green);--pDk:var(--greenDk);--pBg:var(--greenBg);--pB:var(--greenB);--pIn:var(--greenIn)}
.t-red{--p:var(--red);--pDk:var(--redDk);--pBg:var(--redBg);--pB:var(--redB);--pIn:var(--redIn)}
*{-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.screen{padding:16px 20px}
h1{font-size:26px;margin:0;letter-spacing:-.02em;font-weight:700}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;min-width:0}
.top>div:first-child{min-width:0;flex:1 1 auto}
.top h1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.top .logo{box-shadow:0 0 0 2px var(--yel);border-radius:12px;flex:none}
.top .sel{width:auto;flex:0 1 150px;min-width:0;max-width:46%;height:44px;border-radius:22px;font-weight:600;font-size:14px;text-overflow:ellipsis;background:#fff}
.back{display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin-left:-12px;color:var(--ink);text-decoration:none;font-size:30px;line-height:1}
.ttl{display:flex;align-items:center;gap:4px;margin-bottom:12px}
.ttl h1{font-size:22px}
.in{height:48px;box-sizing:border-box;width:100%;padding:0 12px;border-radius:12px;border:1px solid var(--pIn);background:#fff;color:var(--ink);font:inherit;font-size:15px}
textarea.in{height:auto;padding:12px;resize:none}
.l{display:block;font-size:13px;font-weight:600;color:#3F3F3F;margin-bottom:6px}
.fld{margin-bottom:14px}
.row{display:flex;gap:12px}.row>*{flex:1;min-width:0}
.card{border:1px solid var(--pB);border-radius:18px;padding:16px;margin-bottom:14px;background:#fff;box-shadow:0 1px 2px rgba(31,74,43,.05),0 6px 18px rgba(31,74,43,.06);overflow-wrap:anywhere}
.in:focus{outline:none;border-color:var(--yel);box-shadow:0 0 0 3px rgba(242,176,30,.35)}
.btn.yel{background:var(--yel);color:#2B1D00}
.sm{font-size:12px;color:var(--mut)}
.big{font-size:22px;font-weight:700;letter-spacing:-.02em}.big small{font-size:13px;font-weight:500;color:var(--mut)}
.h2{font-size:16px;font-weight:700;margin:0 0 8px}
.line{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.chips.scroll .chip{flex:none}
.chip{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--pIn);background:#fff;color:var(--ink);font:inherit;font-size:14px;font-weight:500}
.chip.on{background:var(--p);border-color:var(--p);color:#fff;font-weight:600}
.chip.mortc.on{background:var(--red);border-color:var(--red)}
.chip.sm{min-height:36px;padding:0 12px;font-size:13px;color:var(--ink)}
.btn{box-shadow:0 2px 6px rgba(31,74,43,.12);display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:14px;background:var(--p);color:#fff;font:inherit;font-size:16px;font-weight:600;border:0;text-decoration:none;width:100%;box-sizing:border-box;margin-bottom:10px}
.btn.red{background:var(--red)}
.btn.alt{background:#fff;color:var(--p);border:1px solid var(--p)}
.btn.danger{background:#fff;color:var(--red);border:1px solid var(--redIn)}
.btn.sm{height:44px;font-size:14px;border-radius:12px}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--pB);color:inherit;text-decoration:none}
.item .main{flex:1;min-width:0}.item .t{font-size:15px;font-weight:600}
.item .d{font-size:13px;color:var(--mut);margin-top:2px}
.item .r{text-align:right}.item .v{font-size:15px;font-weight:700}
.acts{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
.tag{display:inline-block;margin-top:4px;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;background:var(--amberBg);color:var(--amber)}
.mort{color:var(--red)}
.box{padding:12px 14px;border-radius:14px;background:var(--pBg);color:var(--pDk)}
.box.yelbox{background:var(--yelBg);color:var(--yelDk);border:1px solid var(--yelB)}
.box.redbox{background:var(--redBg);color:var(--redDk)}
.hero{background:linear-gradient(135deg,#3A7D4C 0%,#1F4A2B 100%);color:#fff;border-radius:22px;padding:20px;margin-bottom:14px;display:flex;gap:16px;box-shadow:0 8px 22px rgba(31,74,43,.25);border-bottom:4px solid var(--yel)}
.hero>div{flex:1;min-width:0}.hero .n{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.05;color:#FFD866}
.hero .s{font-size:13px;opacity:.9}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.kpi{border:1px solid var(--greenB);border-radius:14px;padding:12px;background:#fff;box-shadow:inset 0 3px 0 var(--yel),0 1px 2px rgba(31,74,43,.05)}
.kpi .v{font-size:16px;font-weight:700;margin-top:2px;word-break:break-word}
.stepper{display:flex;gap:12px;align-items:center}
.stepper button{width:56px;height:56px;flex:none;border-radius:14px;border:1px solid var(--redIn);background:#fff;font-size:28px;color:var(--red);font-weight:600}
.stepper button.plus{background:var(--red);border-color:var(--red);color:#fff}
.stepper input{flex:1;min-width:0;height:56px;box-sizing:border-box;text-align:center;font-size:24px;font-weight:700;border-radius:14px;border:1px solid var(--redIn)}
.empty{text-align:center;color:var(--mut);padding:24px 8px;font-size:14px}
.logo svg{display:block;width:100%;height:100%}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;box-sizing:border-box;height:calc(68px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(255,255,255,.97);border-top:1px solid var(--yelB);display:flex}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--mut);text-decoration:none;font-weight:500}
nav a.on{font-weight:700;color:var(--green)}
nav a.on::before{content:'';position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--yel)}
nav a.on.dep{color:var(--red)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1F1F1F;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;z-index:10;text-align:center}
#toast.show{opacity:1}
.welcome{text-align:center;padding:8px 0 16px}
.welcome .logo{width:120px;height:120px;margin:0 auto 10px}
.welcome p{color:var(--mut);font-size:14px;margin:4px 0 0}
nav a{position:relative}
.bdg{position:absolute;top:7px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;box-sizing:border-box;border-radius:9px;background:#C62828;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
</style>
</head>

function load(){
  try{var d=JSON.parse(localStorage.getItem(KEY));if(d&&d.bandes){d.bandes.forEach(function(x){if(x&&/^Bande \d+$/.test(x.nom)){x.nom=x.nom.replace('Bande','Vague');}});return d;}}catch(e){}
  return {bandes:[],depenses:[],morts:[],distrib:[],ventes:[],stock:[],cur:null,kgSac:50};
}
function save(){if(!canWrite()){return;}try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){toast("Impossible d'enregistrer sur ce téléphone");}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function $(s){return app.querySelector(s);}
function sum(a,k){return a.reduce(function(t,x){return t+(+x[k]||0);},0);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function nf(n){return n.toLocaleString('fr-FR').replace(/[  ]/g,' ');}
function fmt(n){return nf(Math.round(n||0));}
function fmt1(n){return nf(Math.round((n||0)*10)/10);}
function pct(x){return (x||0).toFixed(1).replace('.',',')+' %';}
function num(v){return parseFloat(String(v==null?'':v).replace(/\s/g,'').replace(',','.'))||0;}
function todayISO(){var d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);}
function fd(i){return i?i.slice(8,10)+'/'+i.slice(5,7):'';}
function dayN(b){return Math.max(1,Math.floor((Date.parse(b.fin||todayISO())-Date.parse(b.date))/864e5)+1);}
var toastT;
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},2600);}

function curBande(){
  var b=db.bandes.filter(function(x){return x.id===db.cur;})[0];
  if(!b){b=db.bandes.filter(function(x){return !x.fin;})[0]||db.bandes[db.bandes.length-1];if(b){db.cur=b.id;}}
  return b||null;
}
function stats(b){
  var dep=db.depenses.filter(function(x){return x.b===b.id;}),ve=db.ventes.filter(function(x){return x.b===b.id;}),mo=db.morts.filter(function(x){return x.b===b.id;});
  var dead=sum(mo,'n'),sold=sum(ve,'qty'),depT=sum(dep,'total'),venT=sum(ve,'total');
  return {dep:dep,ve:ve,mo:mo,dead:dead,sold:sold,alive:Math.max(0,b.nb-dead-sold),depT:depT,venT:venT,
    profit:venT-depT,rate:b.nb?dead/b.nb*100:0,costPlaced:b.nb?depT/b.nb:0,costSold:sold?depT/sold:0,avgPrice:sold?venT/sold:0};
}
function chips(g,opts,sel,cls,extra){
  return '<div class="chips '+(cls||'')+'">'+opts.map(function(o){
    return '<button type="button" class="chip'+(extra||'')+(o===sel?' on':'')+'" data-g="'+g+'" data-v="'+esc(o)+'" aria-pressed="'+(o===sel)+'">'+esc(o)+'</button>';}).join('')+'</div>';
}
function chipVal(g){var c=app.querySelector('.chip.on[data-g="'+g+'"]');return c?c.dataset.v:'';}
function bsel(){

    return '<option value="'+b.id+'"'+(b.id===db.cur?' selected':'')+'>'+esc(b.nom)+' · jour '+dayN(b)+(b.fin?' (terminée)':'')+'</option>';}).join('')+'</select>';
}
function bindBsel(){var s=$('#bsel');if(s){s.onchange=function(){db.cur=s.value;save();route();};}}
function itemQty(i){return fmt1(i.qty)+' '+esc(i.unit);}
function applyStk(stk,sign){
  var it=db.stock.filter(function(x){return x.id===stk.item;})[0];
  if(it){it.qty=Math.max(0,Math.round((it.qty+sign*stk.delta)*100)/100);}
}

function saveDep(o,b){
  var cat=chipVal('cat'),desig=$('#f_desig').value.trim(),qty=num($('#f_qty').value),unit=$('#f_unit').value,pu=num($('#f_pu').value);
  if(!desig){toast('Saisissez une désignation');return;}
  if(!(qty>0)){toast('Saisissez une quantité');return;}
  var st=(cat==='Aliment'||cat==='Santé')&&$('#f_stock').checked;
  var kgSac=num($('#f_kg').value)||db.kgSac||50;
  var delta=qty;
  if(st&&cat==='Aliment'){
    if(unit==='sac'){delta=qty*kgSac;}
    else if(unit!=='kg'){toast("Pour le stock d'aliment, choisissez sac ou kg");return;}
  }
  if(o&&o.stk){applyStk(o.stk,-1);}
  var d={id:o?o.id:uid(),ts:o?o.ts:Date.now(),b:b.id,date:$('#f_date').value||todayISO(),cat:cat,desig:desig,qty:qty,unit:unit,pu:pu,total:Math.round(qty*pu),four:$('#f_four').value.trim(),pay:chipVal('pay'),note:$('#f_note').value.trim()};
  if(st){
    var type=cat==='Aliment'?'aliment':'sante',nom=desig,u=cat==='Aliment'?'kg':unit;
    var it=db.stock.filter(function(x){return x.type===type&&x.nom.toLowerCase()===nom.toLowerCase();})[0];
    if(!it){it={id:uid(),type:type,nom:nom,unit:u,qty:0,seuil:type==='aliment'?2*kgSac:1};db.stock.push(it);}
    it.qty=Math.round((it.qty+delta)*100)/100;
    d.stk={item:it.id,delta:delta};
    if(cat==='Aliment'){d.kgSac=kgSac;db.kgSac=kgSac;}
  }
  if(o){db.depenses[db.depenses.indexOf(o)]=d;}else{db.depenses.push(d);}
  save();toast('Dépense enregistrée');location.hash='#/depenses';
}

function toFs(o){var f={};Object.keys(o).forEach(function(k){var v=o[k];if(v===''||v==null){return;}
  if(typeof v==='number'){f[k]=Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v};}else{f[k]={stringValue:String(v)};}});return {fields:f};}
function fromFs(fields){var o={};Object.keys(fields||{}).forEach(function(k){var v=fields[k];
  if(v.stringValue!==undefined){o[k]=v.stringValue;}else if(v.integerValue!==undefined){o[k]=Number(v.integerValue);}else if(v.doubleValue!==undefined){o[k]=v.doubleValue;}});return o;}
function fetchT(url,opt,ms){var c=new AbortController();var t=setTimeout(function(){c.abort();},ms||15000);opt=opt||{};opt.signal=c.signal;
  return fetch(url,opt).then(function(r){clearTimeout(t);return r;},function(e){clearTimeout(t);throw e;});}
function errMsg(e){var m=e&&e.message?String(e.message):'';return (m&&!/Failed to fetch|NetworkError|aborted|Load failed|network/i.test(m))?m:'Pas de connexion internet';}
function typing(){var a=document.activeElement;return !!a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);}

/* --- Côté propriétaire --- */
function ownerToken(){
  var f=cfg.fb;
  return fetchT('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+encodeURIComponent(f.key),
    {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:f.mail,password:f.pass,returnSecureToken:true})})
  .then(function(r){return r.json().then(function(j){
    if(!r.ok){var m=(j.error&&j.error.message)||'';
      throw new Error(/EMAIL|PASSWORD|CREDENTIALS|USER/.test(m)?'E-mail ou mot de passe incorrect':/API.?KEY/i.test(m)?'Clé API incorrecte':/OPERATION_NOT_ALLOWED/.test(m)?"La connexion par e-mail n'est pas activée dans Firebase":('Connexion refusée ('+m+')'));}
    return j.idToken;});});
}
var syncing=false;
async function ownerSync(silent){
  if(!cfg.fb||!cfg.fb.proj||syncing||!canAdv()){return null;}
  syncing=true;
  try{
    var tok=await ownerToken(),base=fsBase(cfg.fb.proj),docs=[],pt='',key=encodeURIComponent(cfg.fb.key);
    do{
      var r=await fetchT(base+'/reports?pageSize=100&key='+key+(pt?'&pageToken='+encodeURIComponent(pt):''),{headers:{Authorization:'Bearer '+tok}});
      var j=await r.json();
      if(!r.ok){var st=(j.error&&j.error.status)||r.status;throw new Error(st==='PERMISSION_DENIED'?"Règles Firestore refusées : vérifiez qu'elles sont publiées":(st==='NOT_FOUND'?"Base Firestore introuvable : vérifiez l'ID du projet":'Erreur du serveur ('+st+')'));}
      (j.documents||[]).forEach(function(d){docs.push(d);});
      pt=j.nextPageToken||'';
    }while(pt);
    var added=0;
    docs.forEach(function(d){
      var docId=d.name.split('/').pop(),x=fromFs(d.fields);x.id=docId;x=cleanReport(x);
      if(db.seen.indexOf(x.id)<0&&!db.pending.some(function(p){return p.id===x.id;})){db.pending.push(x);added++;}
    });
    save();
    for(var i=0;i<docs.length;i++){
      try{await fetchT(base+'/reports/'+encodeURIComponent(docs[i].name.split('/').pop())+'?key='+key,{method:'DELETE',headers:{Authorization:'Bearer '+tok}});}catch(e){}
    }
    cfg.lastSync=Date.now();cfg.syncErr='';saveCfg();
    return added;
  }catch(e){cfg.syncErr=errMsg(e);saveCfg();if(!silent){toast(cfg.syncErr);}return null;}
  finally{syncing=false;}
}
function cleanReport(x){
  var o={id:String(x.id).replace(/[^A-Za-z0-9_-]/g,'').slice(0,40),type:(x.type==='vente'||x.type==='commande')?x.type:'mort',who:String(x.who||'').slice(0,40),
    date:/^\d{4}-\d\d-\d\d$/.test(String(x.date))?String(x.date):todayISO(),note:String(x.note||'').slice(0,200),ts:num(x.ts)};
  if(o.type==='mort'){o.n=Math.max(0,Math.floor(num(x.n)));o.cause=CAUSES.indexOf(x.cause)>=0?x.cause:'Inconnue';}
  else{o.client=String(x.client||'').slice(0,60);o.qty=Math.max(0,Math.floor(num(x.qty)));o.pu=Math.max(0,num(x.pu));o.recu=Math.max(0,num(x.recu));o.pay=PAYS.indexOf(x.pay)>=0?x.pay:'Espèces';
    if(o.type==='commande'){o.tel=String(x.tel||'').slice(0,30);o.livr=/^\d{4}-\d\d-\d\d$/.test(String(x.livr))?String(x.livr):'';}}
  return o;
}

function validateReport(id,ok){

    if(p.type==='mort'){
      var n=Math.max(0,Math.floor(num(el?el.value:p.n)));

      db.morts.push({id:'r'+id,ts:Date.now(),b:b.id,date:p.date,n:n,cause:p.cause,who:p.who,note:p.note||''});

      if(p.qty>s.alive){toast('Il ne reste que '+s.alive+' poulets vivants');return;}
      db.ventes.push({id:'r'+id,ts:Date.now(),b:b.id,date:p.date,client:p.client,qty:p.qty,pu:p.pu,total:Math.round(p.qty*p.pu),poids:'',pay:p.pay,recu:recu,decl:Math.max(0,Math.round(+p.recu||0)),who:p.who,note:p.note||''});

function pendingQ(){return cfg.queue.filter(function(x){return !x.sent;});}
function queueReport(data){
  data.id=uid()+Math.random().toString(36).slice(2,6);data.who=cfg.worker.who;data.ts=Date.now();
  cfg.queue.push({id:data.id,data:data,sent:false,at:Date.now()});
  var sent=cfg.queue.filter(function(x){return x.sent;});
  if(sent.length>30){var drop=sent.slice(0,sent.length-30);cfg.queue=cfg.queue.filter(function(x){return drop.indexOf(x)<0;});}
  saveCfg();
}
var flushing=false;
async function workerFlush(silent){
  if(!cfg.worker||flushing){return 0;}
  var q=pendingQ();if(!q.length){return 0;}
  flushing=true;var n=0,fail='';
  try{
    for(var i=0;i<q.length;i++){
      var it=q[i];
      var r=await fetchT(fsBase(cfg.worker.proj)+'/reports?documentId='+encodeURIComponent(it.id)+'&key='+encodeURIComponent(cfg.worker.key),
        {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(toFs(it.data))});
      if(r.ok||r.status===409){it.sent=true;it.sentAt=Date.now();n++;saveCfg();}
      else{fail=r.status===403?"Envoi refusé : le propriétaire doit vérifier la configuration":'Erreur du serveur ('+r.status+')';break;}
    }
  }catch(e){fail=errMsg(e);}
  finally{flushing=false;}
  cfg.flushErr=fail;saveCfg();
  if(!silent&&(fail||n)){toast(fail?fail:(n+' envoi'+(n>1?'s':'')+' réussi'+(n>1?'s':'')));}
  return n;
}

var LICKEY='poulebox_lic',VKEY='poulebox_vkey';
var CONTACT='Pour obtenir votre clé, contactez le vendeur : +223 77 33 33 77';   /* affiché à l'éleveur sur l'écran Licence */
var TRIAL_DAYS=30,DAY=864e5;
var PUB={"kty":"EC","crv":"P-256","x":"X3LpjmaEFGuedHaGlmHvqvAVNMl8epC2-V4MHsTfoYY","y":"3I3A-bESV6NamnqOy26YP2GlDCM81-j2tSrJogKJljs"};
var lic=loadLic();
function loadLic(){try{var l=JSON.parse(localStorage.getItem(LICKEY));if(l&&typeof l==='object'){l.used=l.used||[];return l;}}catch(e){}return {used:[]};}
function saveLic(){try{localStorage.setItem(LICKEY,JSON.stringify(lic));}catch(e){}}
/* Heure "protégée" : si l'horloge du téléphone recule, on garde la dernière heure connue. */
function licNow(){var n=Date.now(),l=lic.last||0;if(n<l){return l;}if(n-l>6e4){lic.last=n;saveLic();}return n;}
function licOn(){return cfg.role==='owner';}
function licState(){
  if(!lic.start){lic.start=licNow();saveLic();}
  var n=licNow(),te=lic.start+TRIAL_DAYS*DAY;
  if(lic.until&&lic.until>n){return {mode:'paid',until:lic.until,days:Math.ceil((lic.until-n)/DAY)};}
  if(n<te){return {mode:'trial',days:Math.ceil((te-n)/DAY)};}
  return {mode:'expired',days:0};
}
function canWrite(){return !licOn()||licState().mode!=='expired';}
function canAdv(){return !licOn()||licState().mode==='paid';}
function fdl(ms){var d=new Date(ms);return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear();}
function s1(n){return n>1?'s':'';}
function normDev(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
function getDev(){
  var raw='';
  try{if(window.AndroidBridge&&window.AndroidBridge.deviceId){raw=String(window.AndroidBridge.deviceId()||'');}}catch(e){}
  if(!raw){raw=lic.rid||'';}
  if(!raw){
    var A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',b=new Uint8Array(8);
    try{crypto.getRandomValues(b);}catch(e){for(var i=0;i<8;i++){b[i]=Math.floor(Math.random()*256);}}
    for(var j=0;j<8;j++){raw+=A.charAt(b[j]%32);if(j===3){raw+='-';}}
    lic.rid=raw;saveLic();
  }
  return raw;
}
function u8(s){return new TextEncoder().encode(s);}
function b64u(buf){var b=new Uint8Array(buf),s='';for(var i=0;i<b.length;i++){s+=String.fromCharCode(b[i]);}return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function unb64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4){s+='=';}var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++){a[i]=r.charCodeAt(i);}return a;}
function ymd(ms){var d=new Date(ms);return String(d.getFullYear())+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2);}
function ymdMs(s){return new Date(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8)).getTime();}

/* Activation d'une clé : signature ECDSA P-256 vérifiée avec la clé publique intégrée. */
async function licActivate(txt){
  var k=String(txt||'').replace(/\s/g,''),m=/^PB2\.([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]+)$/.exec(k);
  if(!m){return {ok:false,msg:'Clé invalide. Copiez-la en entier.'};}
  if(!window.crypto||!crypto.subtle){return {ok:false,msg:'Vérification impossible sur ce téléphone.'};}
  try{
    var pk=await crypto.subtle.importKey('jwk',PUB,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
    var good=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},pk,unb64u(m[2]),unb64u(m[1]));
    if(!good){return {ok:false,msg:'Clé invalide.'};}
    var p=new TextDecoder().decode(unb64u(m[1])).split('|');
    if(p[0]!=='PB2'||p.length!==4){return {ok:false,msg:'Clé invalide.'};}
    if(normDev(p[1])!==normDev(getDev())){return {ok:false,msg:'Cette clé est faite pour un autre téléphone.'};}
    var days=parseInt(p[3],10),n=licNow();
    if(!(days>=1&&days<=800)||!/^\d{8}$/.test(p[2])){return {ok:false,msg:'Clé invalide.'};}
    if(n-ymdMs(p[2])>90*DAY){return {ok:false,msg:'Cette clé est trop ancienne. Demandez-en une nouvelle.'};}
    var id=m[2].slice(0,24);
    if(lic.used.indexOf(id)>=0){return {ok:false,msg:'Cette clé a déjà été utilisée.'};}
    lic.used.push(id);
    lic.until=Math.max(lic.until||0,n)+days*DAY;
    saveLic();
    return {ok:true,msg:'Version complète activée jusqu\'au '+fdl(lic.until)+' ✓'};
  }catch(e){return {ok:false,msg:'Clé invalide.'};}
}
/* Création d'une clé (espace vendeur uniquement) */
async function venGen(prv,dev,days){
  var d=normDev(dev);
  if(d.length!==8){throw new Error('Code du téléphone invalide (8 caractères).');}
  var key=await crypto.subtle.importKey('jwk',prv,{name:'ECDSA',namedCurve:'P-256'},false,['sign']);
  var pb=u8('PB2|'+d+'|'+ymd(Date.now())+'|'+days);
  var sig=await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},key,pb);
  return 'PB2.'+b64u(pb)+'.'+b64u(sig);
}

/* ---------- Bilan et bénéfices ---------- */
function bilanData(b){
  var s=stats(b),enc=sum(s.ve,'recu'),cats={},causes={},who={},k;
  s.dep.forEach(function(d){cats[d.cat]=(cats[d.cat]||0)+(+d.total||0);});
  var catRows=Object.keys(cats).filter(function(c){return cats[c]>0;}).sort(function(a,c){return cats[c]-cats[a];});
  s.mo.forEach(function(m){var c=m.cause||'Inconnue';causes[c]=(causes[c]||0)+(+m.n||0);});
  var causeRows=Object.keys(causes).filter(function(c){return causes[c]>0;}).sort(function(a,c){return causes[c]-causes[a];});
  s.ve.forEach(function(v){var w=v.who||'Vous';if(!who[w]){who[w]={n:0,q:0,t:0};}who[w].n++;who[w].q+=(+v.qty||0);who[w].t+=(+v.total||0);});
  var vivantsFin=Math.max(1,b.nb-s.dead);
  return {s:s,enc:enc,reste:Math.max(0,s.venT-enc),marge:s.venT?s.profit/s.venT*100:0,cats:cats,catRows:catRows,causes:causes,causeRows:causeRows,who:who,
    aliment:cats['Aliment']||0,seuil:s.depT/vivantsFin,profitSold:s.sold?s.profit/s.sold:0,
    potentiel:(s.alive>0&&s.sold>0)?s.profit+s.alive*s.avgPrice:null,
    manque:(s.profit<0&&s.avgPrice>0)?Math.ceil(-s.profit/s.avgPrice):0};
}

  L.push('');

  L.push('Ventes : '+fmt(s.venT)+' FCFA (encaissé '+fmt(d.enc)+', reste '+fmt(d.reste)+')');

}

async function publishState(silent){

function pdfPages(title,lines){
  var W=1190,H=1684,k=2,m=90,lh=40,pages=[],y,c,g;
  function newPage(first){c=document.createElement('canvas');c.width=W;c.height=H;g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,H);
    g.fillStyle='#2F6B3F';g.fillRect(0,0,W,first?150:70);g.fillStyle='#fff';g.font='700 44px sans-serif';g.fillText('Mon Poulailler',m,first?72:46);
    if(first){g.font='400 28px sans-serif';g.fillText(title,m,118);}y=(first?150:70)+70;pages.push(c);}
  newPage(true);
  lines.forEach(function(l){
    var bold=/^(BILAN|DETTES|PERTE|BÉNÉFICE|TOTAL|Dépenses par|Mortalité par)/.test(l)||/^[^-].* : [\d  ]+ FCFA$/.test(l)&&false;
    g.font=(bold?'700 ':'400 ')+'28px sans-serif';
    var words=String(l).split(' '),cur='',out=[];
    words.forEach(function(w){var t=cur?cur+' '+w:w;if(g.measureText(t).width>W-2*m&&cur){out.push(cur);cur=w;}else{cur=t;}});out.push(cur);
    out.forEach(function(o){if(y>H-90){newPage(false);g.font=(bold?'700 ':'400 ')+'28px sans-serif';}g.fillStyle=bold?'#2F6B3F':'#1F1F1F';g.fillText(o,m,y);y+=lh;});
    if(l===''){y-=14;}
  });

  return pages;
}
function buildPdf(pages){
  var enc=new TextEncoder(),chunks=[],off=[],len=0;
  function add(x){var b=typeof x==='string'?enc.encode(x):x;chunks.push(b);len+=b.length;}
  function obj(n,body){off[n]=len;add(n+' 0 obj\n');add(body);add('\nendobj\n');}
  var n=pages.length,kids=[];
  add('%PDF-1.4\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  for(var i=0;i<n;i++){kids.push((3+i*3)+' 0 R');}
  obj(2,'<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+n+' >>');
  pages.forEach(function(p,i){
    var b=3+i*3,d=atob(p.toDataURL('image/jpeg',0.85).split(',')[1]),u=new Uint8Array(d.length);
    for(var j=0;j<d.length;j++){u[j]=d.charCodeAt(j);}
    obj(b,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 '+(b+1)+' 0 R >> >> /Contents '+(b+2)+' 0 R >>');
    off[b+1]=len;add((b+1)+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+p.width+' /Height '+p.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+u.length+' >>\nstream\n');add(u);add('\nendstream\nendobj\n');
    var cs='q 595 0 0 842 0 0 cm /Im0 Do Q';obj(b+2,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
  });
  var cnt=3+n*3,xr=len;
  add('xref\n0 '+cnt+'\n0000000000 65535 f \n');
  for(var o=1;o<cnt;o++){add(('0000000000'+off[o]).slice(-10)+' 00000 n \n');}
  add('trailer\n<< /Size '+cnt+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
  var all=new Uint8Array(len),p=0;chunks.forEach(function(c){all.set(c,p);p+=c.length;});
  return all;
}
function u8b64(u){var s='',i,ch=0x8000;for(i=0;i<u.length;i+=ch){s+=String.fromCharCode.apply(null,u.subarray(i,i+ch));}return btoa(s);}

var PROP='Propriétaire';

function debtLines(who){

    var dm={};try{JSON.parse(s.dec||'[]').forEach(function(x){dm[x[0]]=x[1];});}catch(e){}
    var od=cfg.mydec,nw=0,rj=0;if(od){Object.keys(dm).forEach(function(k){if(!(k in od)){if(dm[k]){nw++;}else{rj++;}}});}
    var oldDec=JSON.stringify(cfg.mydec);cfg.mydec=dm;
    if(nw||rj){setNotice((nw?nw+' saisie'+(nw>1?'s validée':' validée')+(nw>1?'s':''):'')+(nw&&rj?' · ':'')+(rj?rj+' rejetée'+(rj>1?'s':''):''));}
    var oldh=JSON.stringify([cfg.mydebt&&cfg.mydebt.total,cfg.mydebt&&cfg.mydebt.lines,JSON.parse(oldDec||'null')]),had=!!cfg.mydebt;
    cfg.mydebt={total:Math.max(0,+s.total||0),lines:ls.slice(0,60),ts:s.ts||0,got:Date.now()};cfg.mydebtErr='';saveCfg();return !had||oldh!==JSON.stringify([cfg.mydebt.total,cfg.mydebt.lines,cfg.mydec]);
  }catch(e){cfg.mydebtErr=errMsg(e);saveCfg();return false;}
}
function wDebtBox(){var d=cfg.mydebt;if(!d||!(d.total>0)){return '';}return '<a class="box redbox" href="#/wdettes" style="display:block;text-decoration:none;margin-bottom:14px"><b>Mes dettes : '+fmt(d.total)+' FCFA</b><div class="sm" style="color:var(--redDk)">Touchez pour voir le détail</div></a>';}
document.addEventListener('click',function(e){var t=e.target;if(t&&t.getAttribute&&t.getAttribute('data-dnotice')){cfg.notice=null;saveCfg();route();}});
function vWDettes(){
  var d=cfg.mydebt;
  function body(){
    var d=cfg.mydebt,ls=(d&&d.lines)||[];
    return '<div class="card" style="text-align:center"><div class="sm">Total que vous devez justifier</div><div class="big" style="font-size:34px;margin:4px 0;color:'+((d&&d.total>0)?'var(--red)':'var(--green)')+'">'+fmt(d?d.total:0)+' <small>FCFA</small></div><div class="sm">'+(d&&d.got?'Mis à jour à '+hm(d.got):(cfg.mydebtErr?esc(cfg.mydebtErr):'Pas encore reçu'))+'</div></div>'+
    (!cfg.worker.tok?'<div class="box redbox" style="margin-bottom:12px"><b>Demandez un nouveau code au propriétaire</b><div class="sm" style="color:var(--redDk)">Votre code actuel ne permet pas de voir vos dettes.</div></div>':'')+
    (ls.length?ls.map(function(l){return '<div class="item"><div class="main"><div class="t">'+esc(l[2])+'</div><div class="d">'+fd(l[1])+' · '+(l[0]==='e'?'Écart de caisse':'Crédit client')+'</div></div><div class="r"><b>'+fmt(l[3])+'</b></div></div>';}).join(''):'<div class="empty">Aucune dette.</div>')+
    '<button class="btn" type="button" id="wdImg" style="margin-top:12px">Enregistrer en image</button>';
  }
  return {html:'<div class="screen"><div class="ttl"><a class="back" href="#/accueil" aria-label="Retour">‹</a><h1>Mes dettes</h1></div><div id="wdBody">'+body()+'</div></div>',theme:'t-green',init:function(){
    var bind=function(){var b=$('#wdImg');if(b){b.onclick=function(){var dd=cfg.mydebt||{total:0,lines:[]},rows=dd.lines.map(function(l){return {l:fd(l[1])+' · '+l[2]+' ('+(l[0]==='e'?'Écart de caisse':'Crédit client')+')',r:fmt(l[3])};});
      imageReport('Mes dettes · '+cfg.worker.who,'Au '+fdl(Date.now()),rows,'Total',fmt(dd.total)+' FCFA','mes-dettes-'+todayISO()+'.png');};}};
    bind();
    workerPullDebt().then(function(){var el=$('#wdBody');if(el&&location.hash==='#/wdettes'){el.innerHTML=body();bind();}});
  }};
}

/* ---------- Code de verrouillage (4 chiffres) ---------- */
var LOCK_AFTER=30000,hiddenAt=0,lockBuf='',lockMode='pin',bioCb=null;
function bioAvail(){try{return !!(window.AndroidBridge&&window.AndroidBridge.bioAvailable&&window.AndroidBridge.bioAvailable());}catch(e){return false;}}
function bioAuth(cb){if(!bioAvail()){cb(false,'Non disponible');return;}bioCb=cb;try{window.AndroidBridge.bioAuth();}catch(e){bioCb=null;cb(false,'Erreur');}}
window.__bio=function(ok,msg){var f=bioCb;bioCb=null;if(f){f(!!ok,msg||'');}};
function bioOn(){return !!(cfg.bio&&pinOn()&&bioAvail());}
function lockBio(){bioAuth(function(ok){if(ok&&lockEl()){cfg.pin.n=0;cfg.pin.until=0;saveCfg();hideLock();}});}
function pinOn(){return !!(cfg.pin&&cfg.pin.h);}
function rnd(n){var a=new Uint32Array(n),s='';crypto.getRandomValues(a);for(var i=0;i<n;i++){s+=String(a[i]%10);}return s;}
async function hashPin(p,salt){
  var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+'|'+p)),a=new Uint8Array(b),h='';
  for(var i=0;i<a.length;i++){h+=('0'+a[i].toString(16)).slice(-2);}return h;
}
async function setPin(p){
  var salt=rnd(12),rec=rnd(8),rs=rnd(12);
  cfg.pin={s:salt,h:await hashPin(p,salt),rs:rs,rh:await hashPin(rec,rs),n:0,until:0};saveCfg();return rec;
}
async function checkPin(p){return pinOn()&&(await hashPin(p,cfg.pin.s))===cfg.pin.h;}
function lockEl(){return document.getElementById('lock');}
function showLock(){
  if(!pinOn()||lockEl()){return;}
  var d=document.createElement('div');d.id='lock';
  d.style.cssText='position:fixed;inset:0;z-index:9999;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;overflow:auto';
  document.body.appendChild(d);app.setAttribute('aria-hidden','true');lockBuf='';lockMode='pin';drawLock('');
  if(bioOn()){setTimeout(lockBio,350);}
}
function hideLock(){var d=lockEl();if(d){d.remove();}app.removeAttribute('aria-hidden');lockBuf='';}
function drawLock(msg){
  var d=lockEl();if(!d){return;}
  var dots='';for(var i=0;i<4;i++){dots+='<span style="width:16px;height:16px;border-radius:50%;border:2px solid var(--green);display:inline-block;margin:0 8px;background:'+(i<lockBuf.length?'var(--green)':'transparent')+'"></span>';}
  var keys='';['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(function(k){
    keys+=k===''?'<span></span>':'<button type="button" data-lk="'+k+'" style="height:64px;border-radius:32px;border:1px solid var(--greenB);background:#fff;font-size:26px;font-weight:600;color:var(--ink)">'+k+'</button>';});
  if(lockMode==='rec'){
    d.innerHTML='<div class="logo" style="width:72px;height:72px;margin-bottom:14px">'+LOGO+'</div><h1 style="font-size:20px;margin:0 0 8px">Code oublié</h1><div class="sm" style="margin-bottom:12px;text-align:center">Saisissez votre code de secours à 8 chiffres.</div>'+
    '<input class="in" id="lrec" type="tel" inputmode="numeric" maxlength="8" style="max-width:260px;text-align:center;font-size:20px;letter-spacing:4px"><div class="sm mort" style="min-height:20px;margin:8px 0" id="lmsg">'+(msg||'')+'</div>'+
    '<button class="btn" type="button" id="lrecok" style="max-width:260px">Valider</button><button class="btn alt" type="button" id="lback" style="max-width:260px">Retour</button>';
    return;
  }
  d.innerHTML='<div class="logo" style="width:72px;height:72px;margin-bottom:14px">'+LOGO+'</div><h1 style="font-size:20px;margin:0 0 18px">Entrez votre code</h1><div style="margin-bottom:10px">'+dots+'</div>'+
  '<div class="sm mort" style="min-height:20px;margin-bottom:14px;text-align:center" id="lmsg">'+(msg||'')+'</div>'+
  '<div style="display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center">'+keys+'</div>'+
  ''+(bioOn()?'<button type="button" id="lbio" style="margin-top:18px;height:48px;padding:0 20px;border-radius:24px;border:1px solid var(--yel);background:var(--yelBg);color:var(--yelDk);font:inherit;font-size:15px;font-weight:600">Empreinte ou visage</button>':'')+'<button type="button" id="lforgot" style="margin-top:22px;background:none;border:0;color:var(--green);font-size:14px;text-decoration:underline">Code oublié ?</button>';
}
async function lockKey(k){
  var now=Date.now();
  if(cfg.pin.until>now){drawLock('Trop d\'essais. Patientez '+Math.ceil((cfg.pin.until-now)/1000)+' s.');return;}
  if(k==='⌫'){lockBuf=lockBuf.slice(0,-1);drawLock('');return;}
  if(lockBuf.length>=4){return;}
  lockBuf+=k;drawLock('');
  if(lockBuf.length===4){
    var ok=await checkPin(lockBuf);
    if(ok){cfg.pin.n=0;cfg.pin.until=0;saveCfg();hideLock();return;}
    cfg.pin.n=(cfg.pin.n||0)+1;lockBuf='';
    if(cfg.pin.n%5===0){cfg.pin.until=Date.now()+30000*(cfg.pin.n/5);saveCfg();drawLock('Trop d\'essais. Patientez '+Math.ceil((cfg.pin.until-Date.now())/1000)+' s.');}
    else{saveCfg();drawLock('Code incorrect');}
  }
}
document.addEventListener('click',async function(e){
  var d=lockEl();if(!d||!d.contains(e.target)){return;}
  var t=e.target.closest('button');if(!t){return;}
  if(t.dataset.lk!==undefined){lockKey(t.dataset.lk);return;}
  if(t.id==='lbio'){lockBio();return;}
  if(t.id==='lforgot'){lockMode='rec';drawLock('');return;}
  if(t.id==='lback'){lockMode='pin';drawLock('');return;}
  if(t.id==='lrecok'){
    var v=(document.getElementById('lrec').value||'').replace(/\D/g,'');
    if(v.length===8&&(await hashPin(v,cfg.pin.rs))===cfg.pin.rh){delete cfg.pin;delete cfg.bio;saveCfg();hideLock();toast('Code supprimé. Créez-en un nouveau.');location.hash='#/securite';}
    else{drawLock('Code de secours incorrect');}
  }
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden){hiddenAt=Date.now();}
  else if(pinOn()&&hiddenAt&&Date.now()-hiddenAt>LOCK_AFTER){showLock();}
});
function vSecurite(){
  var on=pinOn();
  var html='<div class="screen"><div class="top"><div class="ttl" style="display:flex;align-items:center;gap:8px"><a class="back" href="#/accueil" aria-label="Retour" style="font-size:28px;text-decoration:none;color:var(--ink);padding:0 8px">‹</a><h1>Code de verrouillage</h1></div></div>'+
  '<div class="box" style="margin-bottom:14px">'+(on?'🔒 <b>Le code est activé.</b> L\'application se verrouille à l\'ouverture et après 30 secondes hors de l\'application.':'Protégez l\'application avec un code à 4 chiffres. Personne ne pourra voir vos ventes et vos dépenses sans ce code.')+'</div>'+
  '<div id="secBody"></div></div>';
  return {html:html,theme:'t-green',init:function(){secDraw();}};
}
function pinInput(id,label){return '<div class="fld"><label class="l" for="'+id+'">'+label+'</label><input class="in" id="'+id+'" type="password" inputmode="numeric" maxlength="4" autocomplete="off" style="font-size:22px;letter-spacing:8px;text-align:center"></div>';}
function secDraw(rec){
  var b=$('#secBody');if(!b){return;}
  if(rec){
    b.innerHTML='<div class="card"><div class="h2">Votre code de secours</div><div class="big" style="letter-spacing:4px;text-align:center;margin:8px 0">'+rec+'</div><div class="sm">Notez-le ailleurs (cahier, message à vous-même). Il sert à débloquer l\'application si vous oubliez votre code. Il ne sera plus affiché.</div></div>'+
    '<button class="btn alt" type="button" id="secCopy">Copier le code de secours</button><a class="btn" href="#/accueil">J\'ai noté, continuer</a>';
    $('#secCopy').onclick=function(){toast(copyText(rec)?'Code de secours copié':'Copie impossible');};return;
  }
  if(!pinOn()){
    b.innerHTML=pinInput('p1','Nouveau code (4 chiffres)')+pinInput('p2','Confirmer le code')+'<button class="btn" type="button" id="secSave">Activer le code</button>';
    $('#secSave').onclick=async function(){
      var a=$('#p1').value,c=$('#p2').value;
      if(!/^\d{4}$/.test(a)){toast('Le code doit avoir 4 chiffres');return;}
      if(a!==c){toast('Les deux codes sont différents');return;}
      secDraw(await setPin(a));
    };return;
  }
  b.innerHTML='<div class="card"><div class="h2">Changer le code</div>'+pinInput('c0','Code actuel')+pinInput('c1','Nouveau code')+'<button class="btn" type="button" id="secChg">Changer le code</button></div>'+
  '<div class="card"><div class="h2">Supprimer le code</div>'+pinInput('d0','Code actuel')+'<button class="btn danger" type="button" id="secDel">Supprimer le code</button></div>'+
  '<div class="card"><div class="h2">Empreinte ou visage</div>'+(bioAvail()?'<div class="sm" style="margin-bottom:10px">Déverrouillez l\'application avec l\'empreinte ou la reconnaissance du visage de ce téléphone. Le code reste utilisable à tout moment.</div><button class="btn '+(cfg.bio?'danger':'yel')+'" type="button" id="secBio">'+(cfg.bio?'Désactiver l\'empreinte / le visage':'Activer l\'empreinte / le visage')+'</button>':'<div class="sm">Non disponible : enregistrez une empreinte ou un visage dans les réglages Android, puis revenez ici. (Nécessite l\'application installée sur Android.)</div>')+'</div>'+
  '<button class="btn alt" type="button" id="secLock">Verrouiller maintenant</button>';
  var sb=$('#secBio');if(sb){sb.onclick=function(){if(cfg.bio){delete cfg.bio;saveCfg();toast('Empreinte / visage désactivés');secDraw();return;}bioAuth(function(ok,msg){if(ok){cfg.bio=1;saveCfg();toast('Empreinte / visage activés');secDraw();}else{toast('Non activé');}});};}
  $('#secChg').onclick=async function(){
    if(!(await checkPin($('#c0').value))){toast('Code actuel incorrect');return;}
    var n=$('#c1').value;if(!/^\d{4}$/.test(n)){toast('Le nouveau code doit avoir 4 chiffres');return;}
    secDraw(await setPin(n));toast('Code changé');
  };
  $('#secDel').onclick=async function(){
    if(!(await checkPin($('#d0').value))){toast('Code actuel incorrect');return;}
    delete cfg.pin;delete cfg.bio;saveCfg();toast('Code supprimé');route();
  };
  $('#secLock').onclick=function(){showLock();};
}

window.addEventListener('hashchange',route);
(function(){var l=document.createElement('link');l.rel='icon';l.href='data:image/svg+xml,'+encodeURIComponent(LOGO);document.head.appendChild(l);})();
if(pinOn()){showLock();}
route();
setTimeout(tick,800);
})();
</script>

try{if(navigator.storage&&navigator.storage.persist){navigator.storage.persist();}}catch(e){}
